                </div>
            </nav>
        </header>
        <section class="container">
            <h1>Contact Form</h1>
            <p>____</p>
        </section>

        <form id="contact-form">

            <div class="form-row">
                <h3>Cliente</h3>
                <div class="form-group">
                    <label for="name">[ Nombre ]</label>
                    <input id="name" type="text" name="name" autocomplete="on">
                </div>

                <div class="form-group">
                    <label for="surname">[ Apellido ]</label>
                    <input id="surname" type="text" name="surname" autocomplete="on">
                </div>
            </div>
            <div class="form-row">
                <h3>Empresa</h3>
                <div class="form-group">
                    <label for="company">[ Empresa ]</label>
                    <input id="company" type="text" name="company" autocomplete="on">
                </div>

                <div class="form-group">
                    <label for="cuit">[ CUIT ]</label>
                    <input id="cuit" type="number" name="cuit" autocomplete="on">
                </div>
            </div>

            

            <div class="form-row">
                <h3>Contacto</h3>
                <div class="form-group">
                    <label for="email">[ Email ]</label>
                    <input id="email" type="email" name="email" autocomplete="on">
                </div>

                <div class="form-group">
                    <label for="phone">[ Número de teléfono ]</label>
                    <input id="phone" type="tel" name="phone" autocomplete="on">
                </div>
            </div>

            <div class="form-group">
                <label for="description">Descripción del proyecto solicitado</label>
                <textarea id="description" name="description"></textarea>
            </div>

            <button type="submit" id="application-button">Enviar</button>

        </form>

        <footer class="footer">
            <div class="container">
                <p>&copy; 2026 YellowPear. All rights reserved.</p>
            </div>
        </footer>

        <script type="module" src="index.js"></script>
        <script type="module" src="form.js"></script>
    </body>
</html>
